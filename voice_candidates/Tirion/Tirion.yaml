age: "55-75"
who: >-
  старейшина (UnionKingdom). 42 реплик.
instruct_en: >-
  Male, 55-75 years old, reedy quavering voice that wavers with age, gentle
  and wise, slow deliberate speech with a warm scratchy quality, trembling
  frailty with steady conviction underneath
texts:
  - Прошу прощения, но ты была так погружена в молитву, я боялся, что любой шум тебя напугает.
  - Как бы то ни было, я был счастлив видеть тебя.
  - Я прожил долгую жизнь. Видел много хорошего и много плохого.
  - Я делал ошибки. Но я учился на них. Каждый день.
  - Мудрость при не с годами. Она при с болью.