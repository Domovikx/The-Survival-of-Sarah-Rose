name: Xanthippe
gender: M
age: "ageless"
who: >-
  маг, живущий столетиями («alive during the First Empire»); властный,
  надменный.
instruct_en: >-
  Male, ageless, deep resonant bass with dry menace, measured and deliberate,
  each word precisely placed, slight echo of centuries
texts:
  - Я предупреждал тебя не трогать этот камень. Теперь смотри, что ты наделала. Исправлять всегда труднее, чем слушать.
  - Что ж, ты совершила большую ошибку. Пока ты жива, ты моя, и я научу тебя послушанию, хочешь ты того или нет.
  - Я жил, когда ваша империя была лишь пылью под моими ногами. Твои столетия для меня — один короткий вздох.