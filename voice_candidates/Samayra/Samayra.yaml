name: Samayra
gender: F
age: "17-19"
who: >-
  дочь шаха Махды, «the last daughter of a dead dynasty»; спутница/любовная
  линия Сары (MagePath).
instruct_en: >-
  Female, 17-19 years old, soft warm soprano, naive and trusting, gentle
  princess, innocent and tender
texts:
  - Я выросла во дворце, где каждый день был наполнен праздниками и радостью, но теперь я понимаю, что настоящая ценность — это близость людей, которых ты любишь.
  - Я делала всё, что могла, чтобы поддерживать свою семью в трудные времена, даже когда мне самой было страно и одиноко.
  - Я сегодня утром гуляла по садам дворца и думала о том, как сильно изменилась моя жизнь за последние месяцы.
  - Мы с тобой провели столько прекрасных моментов вместе, и я надеюсь, что впереди нас ждёт ещё много таких же тёплых и счастливых дней.
  - Я всегда верила в добро и справедливость, потому что даже в самом тёмном мире найдётся место для света и надежды на лучшее будущее.