name: Shah Mahda
gender: M
age: "40-60"
who: >-
  правитель, из-за которого погиб митранский принц (MagePath). 39 реплик.
instruct_en: >-
  Male, 40-60 years old, commanding baritone with imperious arrogance,
  despotic ruler, haughty and dismissive delivery, slow deliberate speech
  with an edge of hunted desperation beneath the authority
texts:
  - Волшебник, ты вернулся с фронта.
  - Скажи мне, как идёт битва?
  - Я правил этим королевством сорок лет. Не поучай меня.
  - Я делал то, что было необходимо. Не оправдываюсь.
  - Мой трон стоит на костях моих врагов. И он будет стоять.