name: Kravel
gender: M
age: "35-50"
who: >-
  Spymaster Kravel — мастер шпионов королевского совета, лояльный,
  осторожный, цепкий. 131 реплика.
instruct_en: >-
  Male, 35-50 years old, quiet low baritone with a dry hushed texture, sly and
  calculating, speaks slowly and deliberately in soft measured phrases, the
  careful murmur of a spymaster.
texts:
  - Я служу короне не мечом, а тишиной. Моя работа — знать то, чего не знают другие.
  - Я бы не советовал вам обсуждать это вслух. У стен этого замка длинные уши.
  - Я проверил твоих людей. Трое из них доносят на тебя, двое пока раздумывают.
  - Я предупреждал короля о заговоре ещё за год. Меня, как обычно, услышали поздно.
  - Я не верю в совпадения. Особенно в те, что случаются дважды.
  - Я знал твоего отца лучше, чем он сам думал. И я видел, как его предали.