name: Marshal Edmond
gender: M
age: "40-60"
who: >-
  Маршал из UnionKingdom, опытный военный, саркастичный, грубоватый. 240
  реплик.
instruct_en: >-
  Male, 40-60 years old, low gruff baritone, military bearing, sarcastic and
  rough, veteran commander's rasp.
texts:
  - Я командовал войсками в десятках сражений, и ни разу не терял головы даже в самой отчаянной ситуации на поле боя.
  - Я делал замечания по поводу твоей подготовки, потому что настоящий солдат должен быть готов к любым испытаниям и не жалеть себя.
  - Я сегодня утром провёл инспекцию лагеря и остался доволен состоянием снаряжения и дисциплины среди бойцов.
  - Мы с тобой прошли через немало трудностей, и я надеюсь, что ты наконец научилась держать себя в руках в критические моменты.
  - Я всегда говорил то, что думал, даже если это звучало грубо, потому что на войне вежливость может стоить тебе жизни.