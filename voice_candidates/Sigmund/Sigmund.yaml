name: Sigmund
gender: M
age: "25-35"
who: >-
  собутыльник/плут из SailorArc, очаровательный жулик, любит выпить не за
  свой счёт. 347 реплик.
instruct_en: >-
  Male, 25-35 years old, pleasant smooth baritone, charming rogue, sly and
  persuasive, light mockery
texts:
  - Я провёл ночь в лучших тавернах порта и каждую минуту наслаждался компанией весёлых людей и отличным вином.
  - Я делал вид, что потерян и одинок, чтобы вызвать сочувствие у окружающих, и это всегда помогало мне получить то, что мне было нужно.
  - Я сегодня утром обнаружил, что в моём кармане появился интересный артефакт, которого там точно не было вчера вечером.
  - Мы с тобой уже давно знакомы, и ты должен знать, что я никогда не упускаю возможности повеселиться за чужой счёт.
  - Я всегда старался держать ситуацию под контролем, даже когда казалось, что всё идёт не по плану, потому что настоящий плут всегда имеет запасной выход.