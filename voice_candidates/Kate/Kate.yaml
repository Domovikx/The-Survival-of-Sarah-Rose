name: Kate
gender: F
age: 18-22
who: 'Подруга детства Сары из замка Розанны. Сбежала из дома ночью, спасаясь от навязанного
  брака со старым богачом, годы скиталась, пока Вейлен не завербовал её в наёмную
  роту «Братья Провидения». Вернулась к Саре по поручению её покойного отца, чтобы
  вывезти её в Летрам, и стала её наставницей в бою.

  Характер: Дерзкая, насмешливая, с живым чувством юмора: подкалывает Сару («princess»,
  «Your Royalty»), флиртует и открыто признаётся в чувствах. Резкая и прямая. В MagePath
  превращается в горького врага, обвиняющего Сару в смерти Калеба и Эфраима, а в HollowWorld
  — спившийся, сломленный алкоголик.

  Отношения: Сара — от близкой подруги и любовницы до врага и жалкого пьяницы; Вейлен
  — командир, которому поклялась служить; Калеб и Эфраим — погибшие товарищи.

  Стиль речи: Просторенная, лёгкая речь с ироничными обращениями к Саре; в состоянии
  падения — пьяная, сбивчивая брань.'
instruct_en: Female, 18-22 years old, confident voice slightly below average pitch,
  bold and spirited, sharp defiant edge, snappy quick cadence, warm beneath the bravado,
  easily shifts from sass to tenderness to sudden fury.
texts:
- Слушай, Сара, если ты собралась мокнуть нас всех ради благородной идеи, сначала
  предупреди, я подготовлюсь.
- Я ненавижу, когда кто-то решает за меня. Особенно когда этот кто-то старше и думает,
  что знает лучше.
- Ты помнишь, как мы сбегали из дворца через чёрную лестницу? Я до сих пор помню каждый
  твой взгляд.
- Держи клинок ниже, дыши ровно. В бою паника убивает быстрее стали, уж я-то знаю.
- Я вернулась не для того, чтобы просить прощения. Я вернулась, потому что ты здесь.
