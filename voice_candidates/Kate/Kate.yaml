name: Kate
gender: F
age: "18-22"
who: >-
  Подруга детства, любовница, наставница; дерзкая, прямая, воинственная;
  вернулась другим человеком, голос чуть ниже среднего, уверенный,
  «с характером»: дерзость → нежность → ярость.
instruct_en: >-
  Female, 18-22 years old, confident voice slightly below average pitch, bold
  and spirited, sharp defiant edge, snappy quick cadence, warm beneath the
  bravado, easily shifts from sass to tenderness to sudden fury.
texts:
  - Слушай, Сара, если ты собралась мокнуть нас всех ради благородной идеи, сначала предупреди, я подготовлюсь.
  - Я ненавижу, когда кто-то решает за меня. Особенно когда этот кто-то старше и думает, что знает лучше.
  - Ты помнишь, как мы сбегали из дворца через чёрную лестницу? Я до сих пор помню каждый твой взгляд.
  - Держи клинок ниже, дыши ровно. В бою паника убивает быстрее стали, уж я-то знаю.
  - Я вернулась не для того, чтобы просить прощения. Я вернулась, потому что ты здесь.