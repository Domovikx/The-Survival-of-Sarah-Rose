name: Gideon
gender: M
age: 30-45
who: 'Один из командиров наёмной роты Вейлена: управляет ядром армии, пока Сара ведёт
  авангард. Участвует в военных советах, командует высадкой у побережья в походе на
  племена.

  Характер: Непринуждённый, с постоянной улыбкой, говорит с Сарой на равных. Прагматик
  с чёрным юмором: честно называет поход в пустыню самоубийственным и предлагает подсунуть
  Вейлену «плохой план», лишь бы тот отменил марш. Иногда рефлексирует об одиночестве
  и зовёт Сару выпить.

  Отношения: Вейлен — начальник, которому верен, но которого пытается образумить;
  Сара — соратница и собутыльник.

  Стиль речи: Казарменный, расслабленный тон, без титулов; прямая оценка ситуации.'
instruct_en: Male, 30-45 years old, low gruff voice with a harsh edge from years of
  command, mercenary commander, clipped authoritative speech, blunt and unpolished,
  speaks with controlled force, medium-slow pace, each sentence an order.
texts:
- У тебя отвратительное настроение. Я вижу это сразу.
- Я командовал отрядом двадцать лет. Знаю людей по глазам.
- Я пошёл на эту войну не за славу. Деньги — другое дело.
- Я делал то, что нужно было. Не больше, не меньше.
- Ты хмуришься. Значит, думаешь. Значит, опасен.
arcs:
- HollowWorld
- BlackMonolith
- WarriorPath
