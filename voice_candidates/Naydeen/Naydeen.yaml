name: Naydeen
gender: F
age: 25-35
who: 'Женщина из окружения Хассара в Аль-Гахаеме (HassarPath): первая встречает Сару
  в доме, отводит её в комнату, распоряжается слугами. Позже — наставница Сары в ''телесных
  искусствах'' (18+).

  Характер: Радушная и властная хозяйка: тепло встречает гостью, заботится о ней,
  но в интимной сцене — уверенная доминантка: ''your training has only just begun''.

  Отношения: С Сарой — гостеприимная покровительница, переходящая в сексуальную наставницу;
  с Софией (служанкой) — мягко-повелительна; упоминает Хассара.

  Стиль речи: Плавная, успокаивающая речь с ласковыми оборотами, короткие уверенные
  фразы-приказы в постели.'
instruct_en: Female, 25-35 years old, warm mezzo-soprano with natural authority, calm
  and commanding presence, speaks with measured confidence, slightly lower register,
  unhurried pace, the kind of voice that makes people listen without raising it
texts:
- Я пошла проверить, что здесь происходит. Оказалось, что шум — это только начало.
- Я делала то, что считала нужным. Не оправдываюсь ни перед кем.
- Власть — это не сила. Это ответственность, которую я несу каждый день.
- Я знала, что придётся принимать трудное решение. И я приняла его.
- Меня не сломали в молодости, не сломают и сейчас.
