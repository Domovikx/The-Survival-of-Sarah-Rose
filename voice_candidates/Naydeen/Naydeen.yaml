texts:
  - Я пошла проверить, что здесь происходит. Оказалось, что шум — это только начало.
  - Я делала то, что считала нужным. Не оправдываюсь ни перед кем.
  - Власть — это не сила. Это ответственность, которую я несу каждый день.
  - Я знала, что придётся принимать трудное решение. И я приняла его.
  - Меня не сломали в молодости, не сломают и сейчас.