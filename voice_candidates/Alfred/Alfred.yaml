name: Alfred
gender: M
age: "45-60"
who: >-
  отец Мариуса из AlfredArc/LifeInRahayal, владелец заведения, радушный
  и прагматичный. 340 реплик.
instruct_en: >-
  Male, 45-60 years old, hearty warm baritone with a slight rasp, jolly
  innkeeper, speaks with enthusiasm and a grin in his voice, gruff but kind,
  booming and welcoming
texts:
  - Я держу это заведение уже двадцать лет, девочка. И за это время я научился видеть людей насквозь.
  - Я был молод, как и ты, и тоже думал, что весь мир у моих ног. Жизнь быстро объяснила обратное.
  - Я не спрашиваю лишнего, и от тебя не требую. Только плати вовремя и не ломай мебель.
  - Я сказал Мариусу, что ты особенная. Он, конечно, сделал вид, что не услышал.
  - Я помню, как этот город ещё был деревней с одной таверной. Моей.
  - Я налил тебе самого лучшего, что у меня есть. Не спрашивай, откуда оно.