name: Alfred
gender: M
age: 45-60
who: 'Старик, глава поместья Гилеада (управляющий) — суровый надзиратель, нанимающий
  Сару в прислугу. Позже (GallowCreek/AlfredPath) — дряхлый, почти умирающий вдовец,
  которого Сара соглашается оживить и за которого выходит замуж, спасая его от смерти.

  Характер: Двуличен: на работе — требовательный, придирчивый, с презрением к «нынешним
  работникам»; дома — порочный старик, который ночью пробирается в комнату гостьи,
  а после женитьбы — восторженный и одержимый. Хищник под маской хозяина.

  Отношения: С Сарой — сначала работодатель, потом ночной домогатель, затем муж; с
  сыном Мариусом — отец, которого тот обслуживает.

  Стиль речи: Просторечная строгая речь хозяина, приказы и угрозы увольнением; в старости
  — сбивчивый, мямлит, оправдывается; после женитьбы — пафосные клятвы и восторги.'
instruct_en: Male, 45-60, hearty warm baritone with slight rasp, innkeeper, jolly,
  gruff but kind, welcoming
texts:
- Я держу это заведение уже двадцать лет, девочка. И за это время я научился видеть
  людей насквозь.
- Я был молод, как и ты, и тоже думал, что весь мир у моих ног. Жизнь быстро объяснила
  обратное.
- Я не спрашиваю лишнего, и от тебя не требую. Только плати вовремя и не ломай мебель.
- Я сказал Мариусу, что ты особенная. Он, конечно, сделал вид, что не услышал.
- Я помню, как этот город ещё был деревней с одной таверной. Моей.
- Я налил тебе самого лучшего, что у меня есть. Не спрашивай, откуда оно.
