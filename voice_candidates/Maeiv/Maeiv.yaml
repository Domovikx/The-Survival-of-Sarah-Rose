name: Maeiv
gender: F
age: 40-55
who: 'Королева Нормандии, «Тихая королева», правящая десятилетиями; инициатор Союзного
  совета против митрийского вторжения; после торговли голосами становится Верховной
  королевой Союза.

  Характер: Хладнокровная, расчётливая политикесса: гостеприимная хозяйка, презрительно
  называющая подданных «счастливыми свинками у корыта». Торгуется за голоса как купец,
  при провале срывается на грубость. Гордая, самолюбивая, не прощает унижений.

  Отношения: С Сарой — настороженно-покровительственная, ценит её ум; с правителями
  Союза (Эдмонд, Антонио) — манипулирует и продавливает; с Эдмондом — открытая вражда.

  Стиль речи: Высокопарно-дипломатичная, приторно-вежливая; при давлении — резкая
  и оскорбительная. Любит метафоры, обращения «gentlemen», «dear».'
instruct_en: Female, 40-55 years old, regal mature alto, commanding and composed,
  slow deliberate pacing with quiet authority, velvet smoothness over a steel core.
texts:
- Раньше мы голосовали тайно, но учитывая, что сегодня на кону, я предлагаю открыто.
- Я правила этим королевством двадцать лет. Знаю каждый камень.
- Я пошла на этот шаг, потому что некому было больше.
- Я делала то, что было необходимо для моего народа.
- Тот, кто поведёт нас, не должен сомневаться в нашей преданности.
