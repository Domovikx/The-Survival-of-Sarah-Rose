name: Dalia
gender: F
age: 20-30
who: 'Молодая женщина-маг, пленница «Мастера» в его башне в Опустошённом мире (MagePath):
  живёт в заточении уже 2-3 года, объясняет Саре устройство метки-поводка и историю
  гибели мира. Со временем становится её соседкой по камере, подругой и защитницей.

  Характер: Спокойная, рассудительная, смирившаяся с судьбой: успокаивает паникующую
  Сару, честно рассказывает о боли и унижении, но сохраняет тёплоту и заботу. Понимает,
  что Мастер заставит их предать друг друга, и честно предупреждает об этом.

  Отношения: С Сарой — сокамерница и подруга, делит постель и тайны; с Мастером —
  вынужденная послушница, объект насилия, которого боится и ненавидит.

  Стиль речи: Ровный, успокаивающий, объясняющий тон; рассказывает предания о магах,
  сожравших мир.'
instruct_en: Female, 20-30, calm even mid-range voice, composed and unflappable, quiet
  confidence
texts:
- Так и есть, и я здесь дольше тебя. Поверь, паника не поможет никому из нас, а хладнокровие
  спасло меня уже не раз.
- Ну, я тоже была магом. Мы обе совершили ошибку, за которую расплачиваемся, так что
  осуждать тебя мне не пристало.
- Не спеши. Сначала вдохни, потом решай. Здесь время течёт иначе, и поспешность стоит
  дороже, чем где-либо ещё.
arcs:
- MagePath
instruct_ru: Женский, 20-30, спокойный ровный голос среднего регистра, собранная и
  невозмутимая, тихая уверенность
