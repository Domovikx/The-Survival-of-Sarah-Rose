name: Dalia
gender: F
age: "20-30"
who: >-
  Заточена в демоническом мире «три или четыре года»; «the girl Dalia»;
  спокойная, собранная.
instruct_en: >-
  Female, 20-30 years old, calm even voice with quiet confidence, level
  mid-range tone without emotional spikes, speaks softly and deliberately,
  composed and unflappable, as if long accustomed to danger.
texts:
  - Так и есть, и я здесь дольше тебя. Поверь, паника не поможет никому из нас, а хладнокровие спасло меня уже не раз.
  - Ну, я тоже была магом. Мы обе совершили ошибку, за которую расплачиваемся, так что осуждать тебя мне не пристало.
  - Не спеши. Сначала вдохни, потом решай. Здесь время течёт иначе, и поспешность стоит дороже, чем где-либо ещё.