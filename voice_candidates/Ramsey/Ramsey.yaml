name: Ramsey
gender: M
age: "40-60"
who: >-
  трактирщик «Dunstin Inn», всех кормит и знает (LifeInRahayal). 58 реплик.
instruct_en: >-
  Male, 45-60 years old, hearty baritone with warm rasp, jolly and boisterous
  innkeeper, speaks loudly with enthusiasm, slightly gravelly from years of
  laughter and ale, friendly and welcoming, the kind of voice that fills a room
texts:
  - Я пошёл в трактирщики, потому что люблю кормить людей. Это моё счастье.
  - Я делал то, что нужно. Гостей принимал, посуду мыл, пиво наливал.
  - Еда — это любовь. Если я кормлю тебя, значит, я уважаю тебя.
  - Получил от родителей, те — от своих. Гостиница в нашей семье уже триста лет.
  - Верно. Гордый владелец этого прекрасного заведения. И я горжусь этим.