name: Ramsey
gender: M
age: 40-60
who: 'Хозяин трактира Dunstin Inn в Рахаяле: семейное дело, доставшееся от родителей.

  Характер: Радушный, словоохотливый провинциал: сам признаёт, что иногда забывается
  и болтает без умолку. Хвастается семьёй (дети Джейкоб, Эльза, сын Данстин — наследник
  имени), гостеприимен, даёт скидки «симпатичной леди», бережёт семейный секрет рагу.
  Добродушный и наивный.

  Отношения: С Сарой — хозяин/постоялица, заботливая болтовня; с семьёй — гордость
  и опора.

  Стиль речи: Говор с просторечиями, обращения «little lady», ласковые шутки.'
instruct_en: Male, 45-60, hearty baritone with warm rasp, jolly and boisterous innkeeper,
  loud and enthusiastic, friendly and welcoming
texts:
- Я пошёл в трактирщики, потому что люблю кормить людей. Это моё счастье.
- Я делал то, что нужно. Гостей принимал, посуду мыл, пиво наливал.
- Еда — это любовь. Если я кормлю тебя, значит, я уважаю тебя.
- Получил от родителей, те — от своих. Гостиница в нашей семье уже триста лет.
- Верно. Гордый владелец этого прекрасного заведения. И я горжусь этим.
