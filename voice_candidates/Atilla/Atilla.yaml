name: Atilla
gender: M
age: 25-30
who: 'Орк-наёмник, боевой инструктор Сары: берётся тренировать её за плату «сколько
  переживёт», позже — возлюбленный и муж. Дарит ожерелье из призрачного серебра и
  цветок с горной вершины, делает предложение.

  Характер: Грубый, резкий, прямолинейный, без стыда за наготу и сексуальность. За
  брутальной внешностью — преданность и романтика: хранит память о первой жене, годами
  скрытно следил за Сарой, ослабляя её врагов; честен до жестокости.

  Отношения: С Сарой — от тирана-инструктора через любовников к мужу; называет «girl»,
  «small one», «little one»; с войском Камала — примкнул наёмником, чтобы воевать
  против её будущих врагов.

  Стиль речи: Короткие рубленые фразы, приказы, грубоватый юмор, минимум слов — максимум
  веса; прозвища-обращения вместо имён.'
instruct_en: Male, 25-30, deep resonant orc baritone, veteran warrior, proud and direct,
  rough warmth
texts:
- Я прошёл через десятки сражений, и каждое из них научило меня ценить тех, кто стоит
  рядом с тобой плечо к плечу в бою.
- Я делал то, что считал правильным, даже когда другие не соглашались со мной, потому
  что настоящий воин знает, как стоять за свои убеждения.
- Я видел, как падали города и как рождались новые надежды, и всё это время я оставался
  верен своему слову и своим товарищам.
- Мы стояли вместе перед лицом неминуемой гибели, и именно в тот момент я понял, что
  настоящая сила — это не в мечах, а в доверии друг другу.
- Я всегда говорил правду, даже когда она была горькой, потому что ложь — это путь
  слабых, а я выбрал путь чести и верности своему народу.
