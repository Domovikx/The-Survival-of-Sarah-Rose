name: Atilla
gender: M
age: "25-30"
who: >-
  соплеменник, «tall the orc stood», массивный ветеран, гордый.
instruct_en: >-
  Male, 25-30 years old, deep resonant orc baritone, confident veteran
  warrior, rough warmth, proud and direct
texts:
  - Я прошёл через десятки сражений, и каждое из них научило меня ценить тех, кто стоит рядом с тобой плечо к плечу в бою.
  - Я делал то, что считал правильным, даже когда другие не соглашались со мной, потому что настоящий воин знает, как стоять за свои убеждения.
  - Я видел, как падали города и как рождались новые надежды, и всё это время я оставался верен своему слову и своим товарищам.
  - Мы стояли вместе перед лицом неминуемой гибели, и именно в тот момент я понял, что настоящая сила — это не в мечах, а в доверии друг другу.
  - Я всегда говорил правду, даже когда она была горькой, потому что ложь — это путь слабых, а я выбрал путь чести и верности своему народу.