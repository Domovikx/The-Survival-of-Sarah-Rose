name: Ephraim
gender: M
age: "20-30"
who: >-
  Товарищ-воин, поддерживает Сару (Training, WarriorPath).
instruct_en: >-
  Male, 20-30 years old, warm gentle voice with steady encouraging tone,
  friendly and reassuring, even unhurried pace, quiet confidence of a loyal
  comrade who believes in what they do.
texts:
  - Я слышал, тебя нужно благодарить за всё это.
  - Некоторые готовы называть тебя святой. А я просто рад, что ты жива.
  - Я пошёл с тобой, потому что верю в то, что мы делаем.
  - Я делал ошибки, но я учусь. Каждый день я становлюсь лучше.
  - Мы с тобой одной крови, Сара. Не забывай об этом.