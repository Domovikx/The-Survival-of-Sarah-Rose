name: Ephraim
gender: M
age: 20-30
who: 'Молодой наёмник из отряда Калеба (лагерь под Баградом): приятель Калеба, сначала
  скептичен к Саре, затем учит её владеть оружием и готовит к экзамену. Проходит с
  ней походы, гибнет от её магии в MagePath-финале, в WarriorPath-развязке хоронит
  Калеба и уходит из армии.

  Характер: Добродушный, насмешливый, верный: подкалывает Калеба и Сару, но по-дружески;
  заботливый, сочувствующий; в горе (гибель Калеба) — глубоко сломлен, с суицидальными
  мыслями, но находит силы уйти к мирной жизни.

  Отношения: Калеб — друг и любовник с детства; Сара — подруга и командир, которую
  уважает.

  Стиль речи: Живая разговорная речь с лёгкой иронией и фамильярностью, в кризисе
  — короткие боевые команды и крики.'
instruct_en: Male, 20-30, warm gentle voice, loyal comrade, friendly and reassuring,
  calm and steady
texts:
- Я слышал, тебя нужно благодарить за всё это.
- Некоторые готовы называть тебя святой. А я просто рад, что ты жива.
- Я пошёл с тобой, потому что верю в то, что мы делаем.
- Я делал ошибки, но я учусь. Каждый день я становлюсь лучше.
- Мы с тобой одной крови, Сара. Не забывай об этом.
