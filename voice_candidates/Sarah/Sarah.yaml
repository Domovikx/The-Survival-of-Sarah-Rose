texts:
  - Отец говорил, что корона всегда тяжелее, чем кажется. Теперь я понимаю, что он имел в виду.
  - Совет может сколько угодно спорить о моей неопытности, но решение принято, и оно будет исполнено.
  - Иногда я скучаю по тем вечерам, когда мы сидели у камина и весь мир казался простым.
  - Ты правда думал, что я не замечу слежку? Мне дважды шепнули, что за мной ходит хвост.
  - Я не прошу у тебя ничего, кроме правды. Если ты не можешь её дать, значит нам не по пути.