name: Razaphel
gender: M
age: "ageless"
who: >-
  «При жизни я был великим учёным и магом», маска-лицо, ряды зубов; загадочный.
instruct_en: >-
  Male, ageless, deep resonant bass with dry menace, measured and deliberate,
  each word precisely placed, slight echo of centuries
texts:
  - Это моя истинная форма. Твой мир, твои боги, твои страхи — всё это лишь отголоски меня самого.
  - Представь, что ты наполнила чашу водой, а затем пробила дно ножом несколько раз. Так выглядит твоя надежда.
  - Не бойся. Страх это всего лишь эхо, которое ты сама заперла внутри. Я слышу его, как старую мелодию.