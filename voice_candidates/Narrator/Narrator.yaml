name: Narrator
gender: F
age: 25-35
who: 'все строки без персонажа: описания, эротические сцены, внутренний монолог Сары.'
instruct_en: Female, 25-35, warm mezzo-soprano, narrator, intimate and unhurried,
  quiet confidence
texts:
- Я долго смотрела на этот дом и не могла решиться войти. Всё было не так, как я помнила,
  и это пугало меня сильнее всего.
- Я пришла к нему поздно ночью, сама не зная зачем. Может быть, я просто устала бояться
  в одиночестве.
- Я могла бы рассказать ей правду ещё тогда, но промолчала. И теперь я расплачивалась
  за это каждую ночь.
- Я стояла у окна и ждала рассвета, как когда-то ждала писем, которые так и не пришли.
- Я сделала всё, что могла. Остальное было уже не в моих силах, и эта мысль приносила
  странное облегчение.
- 'Я помнила этот город другим: тише, светлее, безопаснее. Или, может быть, я просто
  была тогда другой.'
- Я не сразу поняла, что он имел в виду. А когда поняла, мне захотелось убежать, но
  ноги будто приросли к полу.
- Я сидела у камина и слушала, как за окном стучит дождь. В такие ночи прошлое возвращалось
  ко мне без стука.
- Я боялась не смерти, а того, что всё, что я любила, исчезнет вместе со мной, и никто
  этого не заметит.
- Я обещала себе не плакать. Но когда дверь закрылась за ним, я почувствовала, как
  слёзы сами катятся по щекам.
instruct_ru: Женский, 25-35, тёплое меццо-сопрано, рассказчица, интимная и неторопливая,
  тихая уверенность
