name: Vaelen
gender: M
age: "25-35"
who: >-
  командир Сары в WarriorPath, «the commander that broke the insurrectionist
  army», жёсткий, требовательный. 314 реплик.
instruct_en: >-
  Male, 25-35 years old, crisp clear baritone, stern military commander, cold
  and demanding, precise speech
texts:
  - Я командовал подразделением, которое сломило мятежную армию, и каждый солдат в моём отряде знал, что я требую от него абсолютной дисциплины.
  - Я делал акцент на физической подготовке и стратегическом мышлении, потому что настоящий воин должен быть готов к любым испытаниям на поле боя.
  - Я сегодня утром провёл разведывательную операцию и вернулся с важной информацией о перемещениях противника.
  - Мы с тобой обсуждали план действий до мелочей, и я надеюсь, что ты будешь следовать инструкциям без отступлений.
  - Я всегда требовал от своих подчинённых абсолютной точности и своевременности выполнения приказов, потому что на войне каждая секунда может стоить жизни.