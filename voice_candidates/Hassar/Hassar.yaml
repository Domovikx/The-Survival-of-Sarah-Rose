name: Hassar
gender: M
age: "35-45"
who: >-
  Гигант-завоеватель, правит племенами много лет, «stronger than any man»,
  бородатый гигант, глубокий угрожающий харизматичный рокочущий бас.
instruct_en: >-
  Male, 35-45 years old, deep booming bass with velvet menace, powerful
  resonant chest tone, charismatic unhurried delivery, rolls words with
  conquering confidence, slight purr of threat beneath the calm, giant
  presence in every syllable.
texts:
  - Я зашёл убедиться, что тебя хорошо приняли. Но вижу, мои девушки уже устроили тебя лучше, чем я мог ожидать.
  - Я правил племенами много лет и собрал множество вещей. Но тебя не купить, и это тревожит меня сильнее войны.
  - Ты смелая, раз смотришь мне в глаза. Это хорошо. Смелость мне по душе, а трусы в моём шатре не задерживаются.