name: Duke Antonio
gender: M
age: "40-60"
who: >-
  Герцог, член совета в UnionKingdom, скептичный, деловой, без сантиментов.
instruct_en: >-
  Male, 40-60 years old, dry mature baritone, stern and formal, aristocratic measured speech, no-nonsense authority
texts:
  - Я принял это решение после долгих размышлений и обсуждений с советом, и я уверен, что это лучший путь для нашего королевства.
  - Я делал всё возможное, чтобы поддерживать порядок и стабильность в моих землях, даже когда обстоятельства складывались против меня.
  - Я сегодня утром провёл заседание совета, на котором мы обсудили текущую ситуацию и наметили план действий на ближайшие месяцы.
  - Мы с вами обсуждали этот вопрос неоднократно, и я надеюсь, что на этот раз вы примете разумное решение, основанное на фактах.
  - Я всегда старался быть справедливым и честным в своих решениях, потому что настоящий лидер должен служить примером для своих подданных.