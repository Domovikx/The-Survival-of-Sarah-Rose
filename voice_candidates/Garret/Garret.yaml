name: Garret
gender: M
age: 30-45
who: 'Городской охотник приграничного городка (арка WarriorPath), где орудует зверь-убийца.
  Отец был охотником до него; сам уже месяцы выслеживает Бестию безуспешно. Вырезает
  тотемы для лесных духов и ведёт Сару по следам нападений.

  Характер: Грубый, прямой, с нецензурной лексикой, недоверчив к мэру и «большим»
  армиям. Под суровостью — боль о погибшей в шторм сестре и усталость; даёт Саре мудрый
  совет о лесах и о том, что нельзя вечно себя наказывать.

  Отношения: Сара — «Роза-рыцарь», к которой относится свысока, но постепенно уважает;
  мэр — противник массовой зачистки леса; Бестия — главный враг.

  Стиль речи: Просторечная, резкая, с местным колоритом, проклятия и житейская мудрость.'
instruct_en: Male, 30-45, brisk businesslike friendly voice, helpful and direct, upbeat
  and practical
texts:
- Ну, тот, кто вам это сказал, должно быть, идиот.
- Я помогал многим людям в этом городе. Не вижу причины не помогать и тебе.
- Я пошёл на сделку, потому что это выгодно обеим сторонам.
- Я делал бизнес с лучшими людьми этого королевства. И с худшими тоже.
- А вы, полагаю, Рыцарь Розы. Рад знакомству.
