name: Jaeid
gender: M
age: 25-40
who: 'Эмиссар хана Хассара, уроженец касты слуг далёкого востока; привёз Сару из завоёванной
  Розанны к хану, защитил её в пути, а затем заявил на неё права и стал её покровителем
  и возлюбленным; единственный осмеливается отказать хану.

  Характер: Честный, сдержанный и верный, но мягок и романтичен: стесняется чувств,
  краснеет, шутит. Благороден до самоуничижения. Боится в бою, но спокоен, когда дело
  касается Сары; любит её «по зову сердца, а не по праву».

  Отношения: Сара — подопечная, рабыня по законам орды и его любовь; Хассар — хан,
  которому обязан всем; Джасмин — его партнёрша-картографша и близкий друг.

  Стиль речи: Уважительно-формальный («princess», «Great Khan», «my Lady»), переходящий
  в поэтичные ухаживания. Отточенные формулы чести и восточная дипломатичность.'
instruct_en: Male, 25-40, calm steady voice, desert emissary, honorable and soft-spoken,
  gentle, with quiet dignity
texts:
- Я купил тебя, потому что иначе тебя купил бы кто-то хуже. Я не хочу быть твоим хозяином.
- Я был рабом, когда был мальчиком. Я помню, каково это, и не стану делать так с тобой.
- Я знаю пустыню лучше, чем себя самого. Доверься мне, и мы выйдем живыми.
- Я бы остался с тобой, но война зовёт. Я вернусь, если смогу.
- Я не спрашивал тебя о прошлом. И не хочу, чтобы ты спрашивала о моём.
- Я видел, как ты смотришь на звёзды. Я тоже когда-то так смотрел.
