name: Gabriel
gender: M
age: "25-40"
who: >-
  Рыцарь, клятвенный защитник леди Гекаты (MagePath).
instruct_en: >-
  Male, 25-40 years old, firm resonant voice of a sworn knight, solid steady
  baritone, measured and resolute delivery, quiet devotion and protective
  gravity, words weighted by loyalty.
texts:
  - Я клялся защищать её, и я сдержу свою клятву.
  - Я говорил тебе, что это плохая идея. Но ты не послушалась.
  - Я пошёл за ней, потому что она того стоит.
  - Я делал свой выбор каждый день. И каждый раз я выбирал её.
  - Мой меч служит ей. Моё сердце бьётся в такт её шагам.