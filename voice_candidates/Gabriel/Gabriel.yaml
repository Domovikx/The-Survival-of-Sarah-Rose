name: Gabriel
gender: M
age: 25-40
who: 'Рыцарь, присягнувший защитник ведьмы Леди Гекаты (MagePath): сопровождает её
  и Сару в руинах, где они ищут разлом пустоты. Неизменно рядом с Гекатой, сдерживает
  её разрушительную магию и репутацию.

  Характер: Сдержанный, дисциплинированный, с сухим чувством юмора: шутит про «потерявшиеся
  города», которые сожгла бы Геката без него, ворчит, но добродушно. Верен клятве,
  честен, при этом не лишён флирта и тепла.

  Отношения: Геката — госпожа и «подопечная», он её телохранитель и единственный,
  кто позволяет себе подшучивать над ней; с Сарой — союзник, приятель, позже любовник
  втроём.

  Стиль речи: Короткие, точные, слегка ироничные реплики; говорит о долге и присяге
  без пафоса.'
instruct_en: Male, 25-40 years old, firm resonant voice of a sworn knight, solid steady
  baritone, measured and resolute delivery, quiet devotion and protective gravity,
  words weighted by loyalty.
texts:
- Я клялся защищать её, и я сдержу свою клятву.
- Я говорил тебе, что это плохая идея. Но ты не послушалась.
- Я пошёл за ней, потому что она того стоит.
- Я делал свой выбор каждый день. И каждый раз я выбирал её.
- Мой меч служит ей. Моё сердце бьётся в такт её шагам.
arcs:
- MagePath
