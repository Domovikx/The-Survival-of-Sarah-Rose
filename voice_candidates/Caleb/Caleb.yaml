name: Caleb
gender: M
age: 20-25
who: 'Молодой солдат-наёмник в лагере Вейлена, напарник и любовник Эфраима. Вместе
  с Эфраимом берёт Сару под опеку: знакомит с лагерем, тренирует к экзамену, спаррингует
  с ней.

  Характер: Живой, болтливый, легко возбудимый, непосредственный и дружелюбный. Открыто
  гетеро (Эфраим ''mostly goes for guys''), к Саре проявляет нежность и страсть. Добродушно
  поддразнивает, любит вино и пошлые шутки.

  Отношения: С Сарой — старший товарищ-наставник и сексуальный партнёр; с Эфраимом
  — давняя пара; с Кейт — старый знакомый.

  Стиль речи: Разговорная речь солдата: междометия, сленг, комплименты Саре на тренировках,
  в постели — откровенные похвалы и грязные фразы.'
instruct_en: Male, 20-25, clear disciplined voice with military bearing, soldier,
  fair but unyielding, calm under pressure
texts:
- Ты должна рассказать, как ты это сделала. Такой бросок не выходит случайно, я тренировал
  бойцов десятки раз.
- Обещаю, мы будем относиться к тебе как всегда. Ты одна из нас, и в бою, и в лагере
  у костра.
- Спина прямая, локти выше. Ещё раз, и не щади себя. Враг не будет щадить, значит
  и нам нельзя.
