texts:
  - Ты должна рассказать, как ты это сделала. Такой бросок не выходит случайно, я тренировал бойцов десятки раз.
  - Обещаю, мы будем относиться к тебе как всегда. Ты одна из нас, и в бою, и в лагере у костра.
  - Спина прямая, локти выше. Ещё раз, и не щади себя. Враг не будет щадить, значит и нам нельзя.