name: Daemon
gender: M
age: "ageless"
who: >-
  демон из DemonArc, хозяин замка, «the Daemon's voice echoed through the
  vast castle like the beating of a hammer». 154 реплики.
instruct_en: >-
  Male, deep booming bass with otherworldly resonance, slow and hypnotic,
  speaks as if echoing through a vast marble temple, velvet menace
texts:
  - Я ждал тебя долго, смертная. Дольше, чем ты способна вообразить.
  - Я видел, как рушатся миры. Твой мир не будет исключением.
  - Я дал тебе кров, и я же могу его отнять. Запомни это.
  - Я помню каждый голос, что звучал в этих стенах. Скоро их станет на один больше.
  - Я не желаю тебе зла, девочка. Я лишь следую природе вещей.
  - Я был здесь до первого камня этого замка и останусь после последнего.