who: 'Вождь оркского клана (арка HyralArc), захвативший Сару в рабство, когда она
  собирала кремень на его землях. Судит её сам и объявляет собственностью клана, а
  позже устраивает турнир, где победитель получит её в жёны.

  Характер: Жестокий, властный, с животным презрением к людям — называет Сару «human
  whore», угрожает убийством и насилием. Считает орков «настоящими мужчинами» в противовес
  людям.

  Отношения: Сара — пленница-рабыня; клан — подданные, на которых делит добычу.

  Стиль речи: Ломаный упрощённый язык с короткими рублеными фразами («Work, whore!»,
  «Say it!»), приказы и унизительные обращения.'
