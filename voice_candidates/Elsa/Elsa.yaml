name: Elsa
gender: F
age: "14-20"
who: >-
  Дочь трактирщика Рэмзи, сестра Джейкоба (LifeInRahayal).
instruct_en: >-
  Female, 14-20 years old, young bright voice, lively and quick, spirited and
  cheeky, playful rising intonations, unpolished and direct like a girl raised
  in a tavern.
texts:
  - Не обращай на него внимания. Он всегда такой.
  - Я выросла в таверне, так что к грубым мужикам привыкла.
  - Мой брат Джейкоб. Иногда он бывает мудаком.
  - Я пошла работать в таверне с двенадцати лет. Меня научили всему.
  - Мне нравится эта работа. Люди приходят и уходят, а я слышу их истории.