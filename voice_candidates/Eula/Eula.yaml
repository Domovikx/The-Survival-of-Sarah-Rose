name: Eula
gender: F
age: "20-30"
who: >-
  Узница-азартная девица, кости и пари (PrisonArc).
instruct_en: >-
  Female, 20-30 years old, sassy relaxed voice with a fiery edge, mid-range
  and slightly husky, languid drawl that snaps into sharp sarcasm, playful
  mockery with grit, unbothered by confinement.
texts:
  - Какого хрена ты такая и что делаешь в моей камере?
  - Я пошла на сделку с охранником. Не идеально, но работает.
  - Я играла в кости с лучшими игроками этого королевства и выигрывала.
  - Меня не сломала тюрьма, не сломаешь и ты.
  - "Я делала ставки на всё: на карты, на людей, на жизнь. И обычно выигрывала."