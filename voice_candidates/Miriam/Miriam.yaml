who: 'Маленькая дочь Сары и Варги в финальной семейной ветке; вместе с братом Орвеном
  тайком пробирается в спальню родителей, играет в «базилиска» и задаёт вопросы про
  сказки.

  Характер: Бойкая и дерзкая малышка: бьёт брата первой, спорит, но быстро извиняется
  перед мамой. Смышлёная — ловит отца на нестыковке, любопытная, с детской серьёзностью.
  Возраст — лет 6-8.

  Отношения: Сара — мама, Варга — отец (игровой «базилиск»), Орвен — брат, с которым
  вечно воюет.

  Стиль речи: Детская непосредственность: «Mom...», «Dad!», восклицания, наивные вопросы
  и короткие фразы.'
instruct_en: Female child, 8-14, bright clear soprano, playful and eager, quick and
