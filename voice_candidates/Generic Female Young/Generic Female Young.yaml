texts:
  - Проходи, не стой на пороге. Чай уже остывает, а истории лучше рассказывать у тёплого очага, а не на холодной улице.
  - Я слышала, что за лесом видели странные огни. Люди шепчутся, но никто не решается сходить и проверить сам.
  - Если хочешь, оставайся. Места хватит, и лишняя пара рук в хозяйстве никогда не помешает, особенно в такое время.