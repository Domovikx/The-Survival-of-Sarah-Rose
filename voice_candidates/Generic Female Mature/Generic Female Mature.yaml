texts:
- Двадцать лет я веду этот дом, и он пережил худшие времена. Переживёт и нынешние,
  если все будут делать своё дело.
- Не перебивай старших, деточка. Дослушай до конца, и, может быть, ты услышишь нечто,
  что спасёт тебе жизнь.
- Всё повторяется, милая. Войны, болезни, свадьбы. Только лица меняются, а человеческие
  глупости остаются прежними.
