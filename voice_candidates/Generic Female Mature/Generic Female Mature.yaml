name: Generic Female Mature
gender: F
age: "35-60"
who: >-
  Универсальный зрелый женский типаж, спокойный, глубокий, ровный; накрывает
  Miriam, Hecate, Maeiv.
instruct_en: >-
  Female, 35-60 years old, calm deep even voice, low warm register, steady and
  composed, neutral storytelling tone, unhurried measured delivery, the kind of
  voice that sounds like settled wisdom.
texts:
  - Двадцать лет я веду этот дом, и он пережил худшие времена. Переживёт и нынешние, если все будут делать своё дело.
  - Не перебивай старших, деточка. Дослушай до конца, и, может быть, ты услышишь нечто, что спасёт тебе жизнь.
  - Всё повторяется, милая. Войны, болезни, свадьбы. Только лица меняются, а человеческие глупости остаются прежними.