name: Orwen
gender: M
age: 8-14
who: 'Маленький сын Сары и Варги в эпилоге (UnionKingdom): принц, играет в прятки
  с сестрой Мириам, обещает матери беречь сестру, пока она едет к королеве Мэйв.

  Характер: Живой, озорной, отважный малыш: спорит с матерью, храбрится, что не боится
  василиска, воюет с отцом в шутку. Трогательный и смешной ребёнок.

  Отношения: С матерью Сарой — обожание и мелкие споры; с сестрой Мириам — дразнятся
  и дерутся; с отцом Варгой — возня и борьба.

  Стиль речи: Детская речь с восклицаниями: «No fair!», «But mom, we''re not tired,
  really!», «I promise!», «No mercy for a basilisk!».'
instruct_en: Male child, 8-14 years old, bright boyish tenor, mischievous and spirited,
  quick energetic speech with playful inflections and a hint of whine
texts:
- Нечестно!
- Я был тихим!
- Я пошёл посмотреть, что там за шум. Оказалось, интересно.
- Я делал то, что хотели. Не виноват.
- Я знаю секрет. Но не скажу.
