name: Mary
gender: F
age: "30-50"
who: >-
  Работница кухни при дворе (AlfredArc). 86 реплик.
instruct_en: >-
  Female, 30-50 years old, warm earthy mezzo with a folksy lilt, cozy and
  hearty, unhurried chatter of the kitchen, soft rasp of years of hard work.
texts:
  - Значит, он повеселился с тобой? Ну и правильно.
  - Конечно, говорю. Говорю на нём дольше, чем ты живёшь.
  - Я пошла работать на кухню с пятнадцати лет. Научилась всему.
  - Я делала пироги для короля. Он всегда просил добавки.
  - Еда — это любовь. Если я кормлю тебя, значит, я люблю тебя.