name: Mary
gender: F
age: 30-50
who: 'Пожилая рабыня-розанка в лагере кочевников (путь «Другое»): 20 лет в плену у
  старого солдата, помогает Саре освоиться в рабстве, а позже устраивает её побег
  с караваном.

  Характер: Сломленная, но не сломанная: горький цинизм, житейская мудрость, трезвый
  взгляд на выживание; в то же время человечная — предупреждает Сару, жалеет её, рискует
  собой ради её побега. Покорна хозяину, но с внутренним достоинством.

  Отношения: Со старым солдатом — жена-рабыня, привычное сожительство; с Сарой — старшая
  подруга и наставница, затем сообщница в побеге.

  Стиль речи: Просторечная, с диалектными оборотами, откровенная до грубости, с чёрным
  юмором; объясняет законы лагеря и обычаи племени.'
instruct_en: Female, 30-50 years old, warm earthy mezzo with a folksy lilt, cozy and
  hearty, unhurried chatter of the kitchen, soft rasp of years of hard work.
texts:
- Значит, он повеселился с тобой? Ну и правильно.
- Конечно, говорю. Говорю на нём дольше, чем ты живёшь.
- Я пошла работать на кухню с пятнадцати лет. Научилась всему.
- Я делала пироги для короля. Он всегда просил добавки.
- Еда — это любовь. Если я кормлю тебя, значит, я люблю тебя.
