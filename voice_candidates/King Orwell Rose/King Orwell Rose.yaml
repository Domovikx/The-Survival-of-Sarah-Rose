name: King Orwell Rose
gender: M
age: "50-60"
who: >-
  Мудрый, строгий, любящий король; убит в прологе, основной объём — первые
  сцены.
instruct_en: >-
  Male, 50-60 years old, low velvet baritone, wise and stern but gentle with
  his children, regal measured speech, warmth beneath authority.
texts:
  - Я правил этим королевством тридцать лет, и за всё это время я не видел ничего страшнее, чем безразличие совета.
  - Я горжусь тобой, дочь. Больше, чем могу выразить словами, и больше, чем ты когда-либо узнаешь.
  - Я принял решение, которое будет стоить мне многого. Но король обязан платить первым.
  - Я помню день, когда ты родилась. Весь замок молчал, а я не мог сдержать слёз.
  - Я был слишком мягок с тобой, Сара. Пришло время научить тебя тому, что я знаю сам.