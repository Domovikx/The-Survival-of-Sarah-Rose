name: King Orwell Rose
gender: M
age: 50-60
who: 'Король Розанны, отец Сары и Томаса. Возвращается из объезда восточных провинций
  с тревожными слухами о Хассаре, воспитывает наследников, погибает (убийство), после
  смерти является как наставник-дух.

  Характер: Сдержанный, величавый и требовательный к наследникам, но тёплый с дочерью
  — шутит, просит её присматривать за братом. Мудрый стратег-политик: объясняет дипломатию
  метафорой танца. В посмертной сцене — благословляющий и мудрый.

  Отношения: С Сарой — любящий отец и собеседник, с Томасом — строгий наставник о
  долге короля, с советом — верховный правитель.

  Стиль речи: Размеренная, весомая речь с наставлениями, метафорами и государственными
  рассуждениями; дома — отеческая теплота.'
instruct_en: Male, 50-60 years old, low velvet baritone, wise and stern but gentle
  with his children, regal measured speech, warmth beneath authority.
texts:
- Я правил этим королевством тридцать лет, и за всё это время я не видел ничего страшнее,
  чем безразличие совета.
- Я горжусь тобой, дочь. Больше, чем могу выразить словами, и больше, чем ты когда-либо
  узнаешь.
- Я принял решение, которое будет стоить мне многого. Но король обязан платить первым.
- Я помню день, когда ты родилась. Весь замок молчал, а я не мог сдержать слёз.
- Я был слишком мягок с тобой, Сара. Пришло время научить тебя тому, что я знаю сам.
