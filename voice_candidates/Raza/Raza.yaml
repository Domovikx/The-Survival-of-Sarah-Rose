who: 'Гоблин-раб у орков в снежных горах (Hyral): кормит пленную Сару, заключает с
  ней сделку — проводить её к человеческому городку в обмен на защиту. После передумавшего
  бегства становится её хозяином-насильником в своём жилище.

  Характер: Двуликий выживальщик: сначала тихий, услужливый, даже добрый, объясняет,
  что сам раб; при первой же власти над Сарой — резкий, злой, физически жестокий,
  требует послушания и принуждает к сексу.

  Отношения: С Сарой — от проводника-спасителя к жестокому хозяину; с орками — раб,
  выполняющий поручения.

  Стиль речи: Ломаный английский без артиклей и связок: «Me slave, just like you»,
  «You stupid? Why you make fire?» — грубый, прямой.'
