name: Sophia
gender: F
age: 18-25
who: 'Член гарема хана Хассара в его санктуме: первая встречает прибывшую Сару и объясняет
  ей устройство жизни в гареме.

  Характер: Жизнерадостная, наивная и влюблённая в Хассара девушка: искренне уверяет,
  что он «большой мягкий» и не такой, как о нём говорят, с восторгом рассказывает,
  как он принёс ей книжку с картинками из Летхрама. Говорит откровенно и без стеснения,
  немного инфантильна.

  Отношения: С Сарой — подруга-«старокилка» гарема, наставница; с Хассаром — благоговейная
  любовь и доверие.

  Стиль речи: Болтливая, восторженная, с восклицаниями, простые искренние объяснения.'
instruct_en: Female, 18-25 years old, bright lively voice with expressive range, vivacious
  and quick-tempered, swings easily from cheerful energy to quiet vulnerability, clear
  mid-range tone with animated intonation
texts:
- Ты и правда здесь! Новая прибывшая!
- Я София, приятно познакомиться!
- Я пошла сюда, потому что услышала о тебе.
- Я делала вид, что всё хорошо. Но это было непросто.
- Ты удивительная. Знаешь об этом?
