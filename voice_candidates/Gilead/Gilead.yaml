name: Gilead
gender: M
age: 40-60
who: 'Влиятельный политик Империи, слуга Вечного Двора Чёрной Пирамиды. Продвигает
  амбициозный законопроект о западных землях, интригует против соперника Калибана.
  В MagePath — хозяин поместья, где Сара работает служанкой; в BlackMonolith ведёт
  её к своему господину.

  Характер: Высокий бледный человек с грубым тяжёлым голосом; стремителен и резок.
  Жесток и скор на расправу: хватает Сару за горло. Холодный манипулятор, сам признаёт:
  ''I might be a snake, but I keep my promises''.

  Отношения: С Сарой — то как господин над служанкой, то как циничный союзник; с советниками
  — повелительно. Служит хозяину Чёрной Пирамиды, презирает врагов.

  Стиль речи: Короткие властные приказы и допросы, сарказм, риторические вопросы;
  любит говорить загадками и полунамёками.'
instruct_en: Male, 40-60 years old, low stern voice with cold authority, precise deliberate
  articulation, unyielding measured cadence, slight condescension, every word weighted
  like an order from a master of the house, no warmth.
texts:
- Я построил это поместье своими руками, и я требую порядка. Мой дом, мои правила.
- Я бы не советовал тебе испытывать моё терпение. Оно короче, чем кажется.
- Я плачу за послушание, а не за разговоры. Это знает каждый, кто у меня служил.
- Я видел, как люди теряют всё из-за глупости. В моём доме глупости дорого стоят.
- Я не злой человек. Я просто не люблю, когда мои распоряжения обсуждают.
- Я выделил тебе комнату не потому, что добрый. Просто так мне спокойнее.
arcs:
- MagePath
- BlackMonolith
