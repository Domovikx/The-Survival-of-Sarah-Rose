name: Carolyn
gender: F
age: 40-50
who: 'Леди Каролин — казначей королевства, член королевского совета Розанны. Служила
  отцу Сары, теперь советница принцессы и Томаса: готовит коронацию, ведёт переговоры
  с лордом Гайлеадом ради поддержки, сопровождает Сару в походе за возвращение Розанны.

  Характер: Уверенная в себе женщина в мужском мире, спокойная, рассудительная, матерински-покровительственная
  («dear», «my dear»). За мягкостью — жёсткий прагматик: советует «обещать всё и не
  выполнять ничего», манипулировать союзниками; резко обрывает Сару, когда та отвергает
  её план.

  Отношения: С Сарой — наставница и конфидентка с детства; с Томасом — почтительная
  советница («my prince», «my liege»); с Гайлеадом — организатор встречи и сваха-политик.

  Стиль речи: Изысканная, обтекаемая придворная речь с притчами (о банкирах и риске),
  наводящими вопросами и формулами «Of course», «quite right».'
instruct_en: Female, 40-50, mature velvet soprano, businesslike with warm condescension,
  experienced and calculating
texts:
- Я провела годы, изучая тонкости королевских финансов, и могу с уверенностью сказать,
  что ни один банкир не сравнится со мной в расчётах.
- Я делала ставки на самые разные предприятия в своей карьере, и каждый раз я выходила
  победительницей благодаря своей проницательности и опыту.
- Я сегодня утром обсудила с советом новые условия торговли, и они были впечатлены
  моей проницательностью и глубиной моих знаний о рынке.
- Мы с тобой знаем друг друга с тех пор, как ты была маленькой девочкой, и я всегда
  видела в тебе потенциал стать великой женщиной.
- Я всегда говорила, что жизнь — это игра, и те, кто умеет считать ходы, всегда выходят
  победителями даже в самой сложной ситуации.
