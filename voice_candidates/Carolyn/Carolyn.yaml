name: Carolyn
gender: F
age: "40-50"
who: >-
  Lady Carolyn, master of the royal accounts — казначей короны, семья
  банкиров, знала Сару с детства («в тебе всё ещё есть красота твоей
  матери»). 776 реплик.
instruct_en: >-
  Female, 40-50 years old, mature velvet soprano, businesslike with warm
  condescension, experienced and calculating, elegant court speech
texts:
  - Я провела годы, изучая тонкости королевских финансов, и могу с уверенностью сказать, что ни один банкир не сравнится со мной в расчётах.
  - Я делала ставки на самые разные предприятия в своей карьере, и каждый раз я выходила победительницей благодаря своей проницательности и опыту.
  - Я сегодня утром обсудила с советом новые условия торговли, и они были впечатлены моей проницательностью и глубиной моих знаний о рынке.
  - Мы с тобой знаем друг друга с тех пор, как ты была маленькой девочкой, и я всегда видела в тебе потенциал стать великой женщиной.
  - Я всегда говорила, что жизнь — это игра, и те, кто умеет считать ходы, всегда выходят победителями даже в самой сложной ситуации.