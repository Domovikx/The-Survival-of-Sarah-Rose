name: Matthew
gender: M
age: 25-40
who: 'Главный тюремщик западного крыла тюрьмы (PrisonPath, SailorPath): проводит интэйк
  новоприбывшей Сары (инмат-2244) и курирует её заключение.

  Характер: Сухой, бюрократичный и по-своему добродушный служака: любит «чистоту»
  своего крыла, ровно и без жестокости объясняет правила, с плоским юмором. Справедливый,
  но без лишнего участия.

  Отношения: С Сарой — надзиратель/заключённая, держит формальную дистанцию; с другими
  заключёнными — административные отношения.

  Стиль речи: Канцелярско-наставительный тон с просторечиями, нумерация и правила,
  изредка сухой юмор.'
instruct_en: Male, 25-40, flat hard baritone, prison officer, stern and officious,
  cold and clipped
texts:
- Вставай, заключённая.
- Новичок?
- Я пошёл работать в тюрьму, потому что другого выхода не было.
- Я делал то, что нужно. Не больше, не меньше.
- Закон — это закон. Я его исполняю.
