name: Sakar
gender: M
age: 20-30
who: 'Ветеран-наёмник из банды Сигмунда, возящей грузы по Старой дороге между королевствами.
  Встречает Сару, когда Сигмунд подбирает её, и сопровождает до Галлоу-Крик. В WarriorPath
  — главный любовный интерес Сары с грубой страстью и неожиданной уязвимостью.

  Характер: Грубый, циничный, матерящийся боец со шрамами. К Саре сперва враждебен,
  потом оттаивает. За жёсткостью прячет робость и одиночество.

  Отношения: С Сигмундом — подчинённый-ворчун, с Крипом — напарник; с Сарой — от насмешек
  и опасных намёков до страстного романа и предложения жить вместе.

  Стиль речи: Грубая мужская речь с матом и жаргоном дороги, обращения ''girly'',
  философские рассуждения о жизни в дороге; в романтике — ласково-приказной тон.'
instruct_en: Male, 20-30, mid-low streetwise rasp, cocky and cynical, fast clipped
  speech of a port rat, slight sneer
texts:
- Я вырос на этих причалах, красотка. Я знаю, где прячут деньги, и знаю, кто за ними
  придёт.
- Я бы не стал доверять ему и мокрой верёвке. Он такой же ублюдок, как и все мы.
- Я заработал больше за эту ночь, чем за прошлый месяц, и всё благодаря тебе.
- Я не жалуюсь на жизнь, но иногда море требует своё, а у меня всего две руки.
- 'Я сказал ему: не лезь в драку, если не готов лежать. Он полез. Ну, сам виноват.'
- Я проложил дорогу через порт так, что нас не увидела ни одна стража. Иди за мной.
