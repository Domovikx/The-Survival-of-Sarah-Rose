texts:
  - Я вырос среди знати, и меня учили, что слово дворянина стоит дороже золота. Я не собираюсь менять это правило.
  - Я смотрел на тебя весь вечер, Сара Роуз, и ни разу не пожалел об этом.
  - Я прибыл по приглашению вашего отца и остался ради вашего общества, принцесса.
  - Я был бы счастлив сопровождать вас на прогулке, если вы позволите.
  - Я заявляю перед всеми этими людьми о своей любви к тебе. Прошу, окажи мне честь стать твоим мужем.