name: Marion
gender: M
age: 20-30
who: 'Глава дома Achillea — одной из древнейших аристократических семей Розанны, советник
  и соперник королевской семьи. Интриган при дворе: продвигает интересы старых родов,
  предлагает Саре брак по расчёту. В ветке MarionPath после свадьбы раскрывается как
  домашний тиран-садист.

  Характер: Внешне любезен, льстив и снисходителен, но циничен: ''love is a bit of
  an overstated emotion when it comes to marriage''. В постели — жёсткий доминант:
  угрожает, приказывает, унижает и манипулирует, способен на ярость.

  Отношения: С Томасом и Сарой — почтительный вассал и претендент на руку принцессы;
  с Варгой — открытая вражда. Голос старых родов при дворе.

  Стиль речи: Образованная светская речь, книжные обороты, рассуждения о долге и чести
  семьи; в приватных сценах — резкие короткие приказы и грубость.'
instruct_en: Male, 20-30, smooth mid-low baritone, aristocrat, courteous and confident,
  warm sincerity beneath formality
texts:
- Я вырос среди знати, и меня учили, что слово дворянина стоит дороже золота. Я не
  собираюсь менять это правило.
- Я смотрел на тебя весь вечер, Сара Роуз, и ни разу не пожалел об этом.
- Я прибыл по приглашению вашего отца и остался ради вашего общества, принцесса.
- Я был бы счастлив сопровождать вас на прогулке, если вы позволите.
- Я заявляю перед всеми этими людьми о своей любви к тебе. Прошу, окажи мне честь
  стать твоим мужем.
