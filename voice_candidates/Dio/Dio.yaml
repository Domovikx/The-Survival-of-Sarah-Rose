name: Dio
gender: F
age: "20-30"
who: >-
  Воин-сестра Кассиуса, рабыня дома Адамос (BlackMonolith).
instruct_en: >-
  Female, 20-30 years old, stern gritty warrior voice, slightly low register,
  direct and blunt delivery, hardened by battle, with a spark of dry defiance
  beneath the severity.
texts:
  - Я пошла за Кассием, потому что он мой брат. Не потому что он прав.
  - Я дралась с ними и не проиграла ни разу. Хочешь проверить?
  - Рада познакомиться, Сара. Мой брат много рассказывал о тебе.
  - Я привыкла к мечу раньше, чем к книгам. Так что не жди от меня изящных слов.
  - Меня не сломали в рабстве, не сломают и здесь.