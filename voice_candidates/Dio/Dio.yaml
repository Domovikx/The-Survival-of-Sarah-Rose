name: Dio
gender: F
age: 20-30
who: 'Дио — «сестра по войне» Кассия, митрийская рабыня-солдат из Института войны;
  после освобождения решает не быть фермером, а воевать за дело, в которое верит.

  Характер: Сдержанная, рассудительная, философичная; без горечи объясняет митрийскую
  систему рабства, трезво смотрит на свободу; верна Кассию.

  Отношения: С Кассием — сестра по оружию и спутница; с Сарой — собеседница и союзница,
  впервые в жизни заключает «сделку» как с равной.

  Стиль речи: Ровная, книжная речь без просторечий, афоризмы, риторические вопросы,
  спокойная уверенность.'
instruct_en: Female, 20-30 years old, stern gritty warrior voice, slightly low register,
  direct and blunt delivery, hardened by battle, with a spark of dry defiance beneath
  the severity.
texts:
- Я пошла за Кассием, потому что он мой брат. Не потому что он прав.
- Я дралась с ними и не проиграла ни разу. Хочешь проверить?
- Рада познакомиться, Сара. Мой брат много рассказывал о тебе.
- Я привыкла к мечу раньше, чем к книгам. Так что не жди от меня изящных слов.
- Меня не сломали в рабстве, не сломают и здесь.
