name: Varga
gender: M
age: "20-25"
who: >-
  из низших слоёв, красивый, молчаливый, с прошлым; грубоватый, но верный.
instruct_en: >-
  Male, 20-25 years old, mid-range steady voice, calm and measured, quiet and
  taciturn with buried intensity, speaks rarely and deliberately, soft rough
  texture with loyal warmth beneath the stillness
texts:
  - Я не люблю говорить о прошлом. Оно там, где ему и место, и пусть остаётся. Моя клятва тебе значит больше.
  - Ты пришла ко мне, значит доверяешь. Этого мне достаточно, а всё остальное можно оставить за дверью.
  - Я сказал, что защищу тебя, и сдержу слово. Так было, и так будет, пока я дышу.
  - Не нужно слов там, где всё ясно. Просто будь рядом, и я справлюсь с чем угодно.
  - Мой меч служит тебе, моё сердце бьётся в такт твоему. Так было решено в тот день у реки.