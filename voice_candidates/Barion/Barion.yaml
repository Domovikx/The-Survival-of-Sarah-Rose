name: Barion
gender: M
age: "55-70"
who: >-
  Высший генерал, старейший член совета (Other). 18 реплик.
instruct_en: >-
  Male, 55-70 years old, low weighty commanding voice, grizzled old general,
  speaks with firm authority and deliberate cadence, gruff veteran bearing,
  tired but resolute
texts:
  - Я служил этой короне сорок лет и не намерен прекращать.
  - Король Томас, прошу прощения, но как верховный генерал, я полагаю, что это ошибка.
  - Я делал свой долг, когда ты ещё молоком пах. Не поучай меня.
  - Мой меч уже посерёк от крови за эти годы. Но я ещё стою.
  - Я видел падение королевств и рождение империй. Всё это мимолётно.