name: Kim
gender: F
age: 18-20
who: 'Соседка Сары по бараку прислуги в поместье Гилеада (путь «Другое»): работница
  с большим стажем, учит Сару выживать — не выкладываться на работе, беречь силы.
  Поддерживает роман с охранником Натаном.

  Характер: Прагматичная, ленивая с умом, весёлая и болтливая: философия «работай
  вполсилы и протянешь годы, старательные выгорают». Грубовата, с юмором, без иллюзий
  об устройстве мира.

  Отношения: С Сарой — наставница-соседка, сразу берёт шефство; с Натаном — любовники;
  с остальными девушками — держится нейтрально-дружелюбно.

  Стиль речи: Разговорная просторечная речь: «Nah», «ain''t nobody», байки о жизни,
  сальные шутки, житейские притчи о богачах и беременных горничных.'
instruct_en: Female, 18-20 years old, bright lively youthful voice with a clear ringing
  timbre, cheerful and chatty, quick light-footed pace, playful warmth with a hint
  of mischief.
texts:
- Я тут прибираю уже год, и поверь, я знаю каждый угол этого дома лучше хозяев.
- Я видела, как ты приехала. Сразу подумала, что нам будет о чём поговорить.
- Я бы на твоём месте не ела их кашу. Кухарка сегодня злая, а значит, соли в ней втрое.
- Я слышала, что говорят про тебя на кухне. Не бери в голову, они про всех болтают.
- Я пробралась в восточное крыло ночью, просто чтобы посмотреть. Ты же никому не расскажешь?
- Я всегда знала, что уеду отсюда. Осталось только понять, куда и когда.
