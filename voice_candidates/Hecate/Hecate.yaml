name: Hecate
gender: F
age: 30-45
who: 'Ведьма Ордена и знаменитая исследовательница, подруга Ксанфиппа; в руинах древнего
  города выслеживает магический импульс, находит Сару и объединяется с ней, позже
  участвует в делах Ордена и в близких сценах с Габриэлем и Сарой.

  Характер: Дерзкая, бойкая, самоуверенная, болтливая и ехидная — подкалывает слугу
  Габриэля, но и кокетлива, азартна, любопытна; месяцами лезла через джунгли за сигналом.

  Отношения: С Габриэлем — ворчливо-нежная пара «госпожа-слуга» (перерастает в роман);
  с Сарой — старшая подруга-наставница; с Ксанфиппом — давняя приятельница по Ордену.

  Стиль речи: Живая разговорная речь: восклицания, сарказм, преувеличения, перебивки;
  обидчивые риторические вопросы.'
instruct_en: Female, 30-45 years old, commanding mezzo-soprano with imperial confidence,
  clear authoritative timbre, slightly amused edge, speaks with unhurried certainty
  and quiet power, the voice of a sorceress who expects obedience.
texts:
- Беги, сейчас же! Посади как можно больше людей на эти корабли!
- Я пошла на этот шаг, потому что некому было больше.
- Я делала то, что было необходимо. Не спрашивай меня о методах.
- Пожалуйста, Габриэль, доверься мне хоть раз, хорошо?
- Магия — это не дар. Это бремя, которое я несу с рождения.
