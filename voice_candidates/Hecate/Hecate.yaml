name: Hecate
gender: F
age: "30-45"
who: >-
  Могущественная леди-маг с рыцарем-слугой (MagePath), властная,
  самоуверенная, чуть насмешливая.
instruct_en: >-
  Female, 30-45 years old, commanding mezzo-soprano with imperial confidence,
  clear authoritative timbre, slightly amused edge, speaks with unhurried
  certainty and quiet power, the voice of a sorceress who expects obedience.
texts:
  - Беги, сейчас же! Посади как можно больше людей на эти корабли!
  - Я пошла на этот шаг, потому что некому было больше.
  - Я делала то, что было необходимо. Не спрашивай меня о методах.
  - Пожалуйста, Габриэль, доверься мне хоть раз, хорошо?
  - Магия — это не дар. Это бремя, которое я несу с рождения.