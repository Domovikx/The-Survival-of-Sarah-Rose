who: 'Красивый молодой раб на маскараде в поместье Гайледа — «ценное имущество» хозяина;
  позже в Калшуре — воин-освободитель, встречающий Сару как освободительницу города
  от племён.

  Характер: Циничный и меланхоличный острослов: иронизирует над своим положением,
  топит печаль в вине, флиртует с Сарой. Гордый воин, мечтающий о боях, лёгкий и самоироничный.

  Отношения: С Сарой — флирт и взаимное притяжение на маскараде; в Калшуре — уважение
  и готовность служить ей как освободителю.

  Стиль речи: Остроумный, с самоиронией и сарказмом, галантные комплименты, игривое
  обращение «Sarah-from-far-away».'
