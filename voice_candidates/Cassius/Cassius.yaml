name: Cassius
gender: M
age: "25-35"
who: >-
  рыцарь из BlackMonolith, брат Дио, куртуазный, уважительный к Саре
  («Рыцарь Розы»). 248 реплик.
instruct_en: >-
  Male, 25-35 years old, noble calm tenor, courteous and slightly formal,
  knightly bearing, speaks with measured politeness and quiet confidence,
  clear crisp articulation
texts:
  - Я присягал ордену, и я держу слово. Рыцарь Розы может рассчитывать на мой клинок.
  - Я слышал о ваших подвигах, и, должен признать, слухи не лгали.
  - Я бы счёл за честь сражаться рядом с вами, леди Сара.
  - Я дал обет защищать слабых, и я не выбираю, кто достоин защиты.
  - Я думал, что видел всё, но ваша история заставила меня пересмотреть взгляды.
  - Я не бросаю слов на ветер. Если я обещал, значит, так и будет.