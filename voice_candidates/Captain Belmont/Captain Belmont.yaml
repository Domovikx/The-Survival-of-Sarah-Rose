name: Captain Belmont
gender: M
age: 40-50
who: 'Капитан корабля, на котором Сара плывёт из Розанны в Летрам. Шантажирует пассажирок
  неоплаченной частью пути, превращая долг в сексуальную кабалу, позже нанимает Сару
  матросом в SailorPath и появляется в финале при падении Летрама, унижая её.

  Характер: Грубый, циничный, похотливый морской волк: торгуется за плату, развлекается
  унижением и властью над беспомощными. Амбивалентен: в SailorPath берёт Сару на борт
  с издевательской снисходительностью, в финале срывается на жестокость и насилие.

  Отношения: Сара и её подруга — жертвы его долговой ловушки; обращается «blondie»,
  считает её своей собственностью после сделки.

  Стиль речи: Просторечный, морской жаргон: «draw up the anchor», «rigged the sails»,
  грубые приказы, сальные намёки, насмешливые обращения «Blondie», «come on now».'
instruct_en: Male, 40-50, low raspy smoker's voice, sea captain, weathered and direct,
  gruff but strong
texts:
- Я думал, это ты, но не был до конца уверен. Море меняет людей, знаешь ли. Оно и
  соли, и седины добавляет.
- Надо сказать, Блонди, из тебя вышла бы славная морячка. Редко кто так держится на
  палубе в первый шторм.
- Держись за планшир, девочка. Шторм не время для сантиментов, сначала удержим корабль,
  а чувства оставим на потом.
arcs:
- Other
- SailorPath
- MagePath
instruct_ru: Мужской, 40-50, низкий хриплый голос курильщика, морской капитан, обветренный
  и прямой, грубый, но сильный
