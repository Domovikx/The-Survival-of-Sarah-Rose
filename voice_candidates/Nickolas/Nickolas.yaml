who: 'Матрос на корабле капитана Белмонта, волею судьбы напарник Сары: учит её морскому
  делу, переживает с ней кораблекрушение и выживание в горах Хирала; конфликтует с
  жестоким капитаном, бунтует и уходит с Сарой.

  Характер: Легкомысленный, добродушный и живучий: сирота из Летрама, сбежал в 13
  лет, годами дрейфует от порта к порту. Разговорчив и любопытен, умеет сглаживать
  углы, но упрям и горд, когда дело касается унижений капитана. Верен Саре, способен
  на отчаянные решения.

  Отношения: Сара — судовой товарищ и предмет симпатии (флиртует, ревнует к капитану,
  вместе выживают после крушения); капитан Белмонт — деспотичный наниматель, против
  которого зреет бунт.

  Стиль речи: Матросский сленг: «ain''t», «gotta», «fuckin''», жаргон морского дела,
  шутки-подколы, простые житейские истории.'
