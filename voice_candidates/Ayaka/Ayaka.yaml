name: Ayaka
gender: F
age: 20-28
who: 'Благородная леди с восточной границы, захваченная ордой хана Хассара и живущая
  в его лагере уже около двух лет; на восьмом месяце беременности от него. Её семья
  сбежала при набеге, бросив женщин каравана.

  Характер: Спокойная, рассудительная, с тонкой иронией. Прошла путь от ненависти
  (плюнула в лицо Хассару) до любви: он терпеливо слушал её ярость, и теперь она честно
  говорит, что счастлива. Смотрит на свою историю трезво и без иллюзий о родне.

  Отношения: Хассар — захватчик, ставший любимым мужчиной; братья и отец — предатели,
  бросившие её; Сара — новая знакомая, которой она доверяет свою историю.

  Стиль речи: Утончённая, ровная, немного отстранённая речь знатной леди; склонна
  к самоанализу и мягкой самоиронии.'
instruct_en: Female, 20-28 years old, soft gentle voice with a delicate Eastern timbre,
  careful precise articulation, polite and slightly reserved, speaks quietly with
  a subtle foreign cadence
texts:
- Я пошла к ним в гости и сразу поняла, что здесь всё по-другому.
- Я делала всё, что могла, но они всё равно остались холодны.
- Меня зовут Ая, но можешь звать просто Ая — меня все так зовут.
- Я принесла тебе подарок. Это традиция на моей родине.
- Я скучаю по дому, но здесь тоже есть своё очарование.
