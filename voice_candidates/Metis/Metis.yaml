name: Metis
gender: M
age: "30-60"
who: >-
  маг из BlackMonolith-арки, друг Ксана (Xanthippe), владелец корабля,
  «friendly fellow, a little full of himself». 425 реплик.
instruct_en: >-
  Male, 30-60 years old, medium-low baritone, good-natured confidence,
  slight mockery, lively storyteller, friendly
texts:
  - Я путешествовал по самым далёким землям и видел столько чудес, что мне порой кажется, будто я прожил несколько жизней одновременно.
  - Я делал открытия, которые шокировали даже самых опытных магов моего времени, и всегда делился своими знаниями с теми, кто был готов учиться.
  - Я сегодня утром размышлял о природе магии и понял, что ключ ко всем тайнам скрывается в простых вещах, которые мы часто игнорируем.
  - Мы с тобой обсуждали этот вопрос с самого утра, и я рад, что ты наконец начала понимать глубину моих рассуждений о мире и его устройствах.
  - Я всегда относился к жизни с долей юмора и оптимизма, потому что даже в самые тёмные времена стоит находить поводы для улыбки и радости.