name: Metis
gender: M
age: 30-60
who: 'Маг Ордена, бывший ученик Ксана, которого он ищет в его доме в арке BlackMonolith.
  Становится учителем Сары по магической ботанике и инфузии; в конце оставляет ей
  письмо о магической аномалии в древнем городе Варань.

  Характер: Обходительный, лисоподобный, с лёгкой иронией. Умудрённый странник Ордена,
  уставший от дорог, любит уют у огня. Умело уходит от прямых ответов, но как наставник
  терпелив и методичен.

  Отношения: Ксан — наставник, которого разыскивает; Сара — новая ученица/хозяйка
  дома; Самайра — с ней любезен; Орден — коллеги-сплетники.

  Стиль речи: Вежливая, витиеватая речь старой школы с междометиями-восклицаниями,
  мягкие намёки вместо прямых вопросов; в преподавании — чёткие объяснения и практический
  подход.'
instruct_en: Male, 30-60, medium-low baritone, good-natured confidence, slight mockery,
  lively storyteller
texts:
- Я путешествовал по самым далёким землям и видел столько чудес, что мне порой кажется,
  будто я прожил несколько жизней одновременно.
- Я делал открытия, которые шокировали даже самых опытных магов моего времени, и всегда
  делился своими знаниями с теми, кто был готов учиться.
- Я сегодня утром размышлял о природе магии и понял, что ключ ко всем тайнам скрывается
  в простых вещах, которые мы часто игнорируем.
- Мы с тобой обсуждали этот вопрос с самого утра, и я рад, что ты наконец начала понимать
  глубину моих рассуждений о мире и его устройствах.
- Я всегда относился к жизни с долей юмора и оптимизма, потому что даже в самые тёмные
  времена стоит находить поводы для улыбки и радости.
arcs:
- BlackMonolith
instruct_ru: Мужской, 30-60, средне-низкий баритон, добродушная уверенность, лёгкая
  насмешка, живой рассказчик
