texts:
  - Папа? Я так скучал по тебе. Каждую ночь я смотрю на ту старую картину и вспоминаю, как ты учил меня держать меч.
  - Сестра всегда знала, что делать. А я только и умею, что бояться и ждать. Но теперь всё изменится.
  - Я принял решение. Пусть мне страшно и руки дрожат, но я больше не отступлю. Я хочу быть достойным её.