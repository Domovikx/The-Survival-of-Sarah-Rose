name: Thomas
gender: M
age: 15-17
who: 'Младший брат Сары, принц Розанны, после убийства отца становится королём; в
  прологе — избалованный подросток, дальше — растерянный молодой король, ищущий совета
  у сестры, а в поздних ветках — уже уверенный монарх, ведущий совет.

  Характер: Живой, капризный и инфантильный: канючит, скучает на уроках, завидует
  способностям отца. После коронации — тревожный и подавленный: не спит, не справляется
  с докладами, тоскует по отцу. К концу истории взрослеет: ведёт заседания совета,
  взвешенно решает споры, но всё равно опирается на сестру.

  Отношения: Сара — любимая сестра и наставница, к ней приходит за советами; отец
  — кумир, чья смерть его ломает; советники (Кравел, леди Каролин) — с ними держится
  по-королевски; Мэрион и Варга — претенденты на руку сестры.

  Стиль речи: Разговорный, с подростковыми нотками: «Ugh, I can''t stand the guy»,
  растянутые «Pleeease». Как король — канцелярски-вежливый: «Thank you for your council,
  sister».'
instruct_en: Male, 15-17, soft youthful tenor, young prince, sincere and earnest,
  hesitant, boyish warmth
texts:
- Папа? Я так скучал по тебе. Каждую ночь я смотрю на ту старую картину и вспоминаю,
  как ты учил меня держать меч.
- Сестра всегда знала, что делать. А я только и умею, что бояться и ждать. Но теперь
  всё изменится.
- Я принял решение. Пусть мне страшно и руки дрожат, но я больше не отступлю. Я хочу
  быть достойным её.
