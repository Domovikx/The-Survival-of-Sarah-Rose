who: >-
  наследник трона, слабовольный, но добрый; опирается на сестру.
instruct_en: >-
  Male, 15-17 years old, soft youthful tenor, slightly unsteady and delicate,
  sincere and earnest, gentle hesitant delivery that grows steadier with
