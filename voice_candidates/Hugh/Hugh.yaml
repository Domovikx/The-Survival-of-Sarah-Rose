name: Hugh
gender: M
age: "25-40"
who: >-
  Делец, не сводящий глаз с денег (Other), цепкий, меркантильный.
instruct_en: >-
  Male, 25-40 years old, sharp tenacious voice with a calculating edge, quick
  clipped delivery, slightly nasal merchant's tone, shrewd and impatient,
  the manner of a man who weighs every word in coin, brisk and transactional.
texts:
  - Можешь льстить сколько угодно, Аларик. Я не продешу.
  - Я пошёл на эту сделку, потому что вижу выгоду.
  - Я делал деньги в каждом королевстве. Знаю толк в прибыли.
  - Плати или ищи другого дурака, который рискнёт петлёй ради тебя.
  - Мои глаза видят золото там, где другие видят мусор.